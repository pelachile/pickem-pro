version: 1
backend:
  phases:
    build:
      commands:
        - npx ampx generate outputs --app-id $AWS_AMPLIFY_APP_ID --branch $AWS_BRANCH
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*