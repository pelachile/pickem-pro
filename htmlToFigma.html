<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Game Card</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #062440 0%, #005A7C 50%, #4DA6D9 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            min-height: 100vh;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .team-name {
            color: white;
            font-size: 32px;
            font-weight: 700;
            margin: 0;
        }

        .vs-symbol {
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            font-weight: 500;
        }

        .status-badge {
            background: #4DA6D9;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .date-badge {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .matchup-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 16px 32px;
            border-radius: 24px;
            font-size: 18px;
            font-weight: 600;
            margin: 24px auto;
            display: block;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .matchup-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .teams-section {
            display: flex;
            align-items: center;
            gap: 40px;
            margin: 32px 0;
        }

        .team-side {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 24px;
            border-radius: 12px;
            position: relative;
        }

        .team-away {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #FF6B35;
        }

        .team-home {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .team-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .chiefs-logo {
            background: #E31837;
        }

        .chargers-logo {
            background: #0080C6;
        }

        .team-info {
            flex: 1;
        }

        .team-name-main {
            color: white;
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
        }

        .team-record {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }

        .team-label {
            background: #4DA6D9;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            position: absolute;
            top: -8px;
            left: 24px;
        }

        .home-label {
            background: #FF6B35;
        }

        .vs-indicator {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4DA6D9, #FF6B35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            font-weight: 700;
            position: relative;
            z-index: 10;
        }

        .pick-button {
            background: rgba(77, 166, 217, 0.2);
            border: 1px solid #4DA6D9;
            color: #4DA6D9;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pick-button.selected {
            background: #4DA6D9;
            color: white;
        }

        .pick-button.unselected {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.6);
        }

        .venue {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-top: 24px;
        }

        .venue-icon {
            width: 16px;
            height: 16px;
            opacity: 0.6;
        }

        .check-icon {
            position: absolute;
            top: 16px;
            right: 50%;
            transform: translateX(50%);
            width: 32px;
            height: 32px;
            background: #4DA6D9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="game-card">
        <!-- Check icon for selected pick -->
        <div class="check-icon">✓</div>
        

        <!-- Status and Date badges -->
        <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
            <div class="status-badge">Scheduled</div>
            <div class="date-badge">Fri, Sep 5</div>
        </div>

        <!-- Matchup button -->
        <button class="matchup-button">Kansas City Chiefs @ Los Angeles Chargers</button>

        <!-- Teams section -->
        <div class="teams-section">
            <!-- Away team (Chiefs) -->
            <div class="team-side team-away">
                <div class="team-label">AWAY</div>
                <div class="team-logo chiefs-logo">KC</div>
                <div class="team-info">
                    <h3 class="team-name-main">Kansas City Chiefs</h3>
                    <p class="team-record">10-1</p>
                </div>
                <button class="pick-button selected">Your Pick</button>
            </div>

            <!-- VS indicator -->
            <div class="vs-indicator">VS</div>

            <!-- Home team (Chargers) -->
            <div class="team-side team-home">
                <div class="team-label home-label">HOME</div>
                <div class="team-logo chargers-logo">LAC</div>
                <div class="team-info">
                    <h3 class="team-name-main">Los Angeles Chargers</h3>
                    <p class="team-record">6-5</p>
                </div>
                <button class="pick-button unselected">Click to Pick</button>
            </div>
        </div>

        <!-- Venue information -->
        <div class="venue">
            <svg class="venue-icon" fill="currentColor" viewBox="0 0 20 20">
                <path d="M10 2L3 7v11h4v-6h6v6h4V7l-7-5z"/>
            </svg>
            <span>Corinthians Arena</span>
        </div>
    </div>
</body>
</html>
